name: Run Fantasy Monte Carlo Simulations

on:
  schedule:
    # Runs every Thursday at 12:00 PM EDT
    - cron: '0 16 * * 4'
    # Runs every Sunday at 10:00 AM EDT
    - cron: '0 14 * * 0'
  workflow_dispatch:

jobs:
  run-simulations:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("dplyr", "purrr", "readr"))'

      - name: Run simulation script
        run: |
          Rscript run_simulations.R

      - name: Commit and push generated results
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add results/*.csv || true
          git commit -m "Automated update: latest simulation percentiles" || echo "No changes to commit"
          git push
